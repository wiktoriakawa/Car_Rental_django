{% extends "base.html" %}
{% load static %}
{% block content %}

<!-- sub banner -->
<div class="sub-banner overview-bgi">
    <div class="container breadcrumb-area">
        <div class="breadcrumb-areas">
            <h1>Logowanie</h1>
        </div>
    </div>
</div>

<!-- sekcja logowania -->
<div class="contact-section mt-5 mb-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                
                <!-- forms -->
                <div class="form-section">
                    <div class="text-center">
                        <h3>Zaloguj się</h3>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        {% if request.GET.next %}
                            <input type="hidden" name="next" value="{{ request.GET.next }}">
                        {% endif %}

                        <div class="form-group mb-3">
                            <label class="mb-1">Nazwa użytkownika</label>
                            <input type="text" name="username" class="form-control" placeholder="Wpisz login" required>
                        </div>

                        <div class="form-group mb-4">
                            <label class="mb-1">Hasło</label>
                            <input type="password" name="password" class="form-control" placeholder="Wpisz hasło" required>
                        </div>

                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-theme w-100 btn-lg text-white">
                                Zaloguj się
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="text-muted">Nie masz konta? <a href="{% url 'signup' %}"> Zarejestruj się tutaj</a></p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock content %}
