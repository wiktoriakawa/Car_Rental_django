{% load static %}

<header class="main-header sticky-header header-with-top">
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="fa fa-bars"></span>
            </button>
            <div class="navbar-collapse collapse w-100" id="navbar">
                <ul class="navbar-nav ml-auto">
                    {% if user.is_authenticated %}
                    <li class="nav-item" {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                        <a class="nav-link" href="{% url 'profile' %}">My profile</a>
                    </li>
                    {% endif %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                        href="{% url 'home' %}">
                            Home
                        </a>

                    </li>
                    <li class="nav-item {% if request.resolver_match.url_name == 'cars' %}active{% endif %}">
                        <a class="nav-link" href="{% url 'cars' %}">
                            Cars
                        </a>
                    </li>                    
                                        
                </ul>
            </div>
        </nav>
    </div>
</header>
